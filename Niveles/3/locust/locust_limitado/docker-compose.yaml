services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    cpus: "${API_CPUS:-1.0}"
    mem_limit: "${API_MEMORY:-1g}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')
      interval: 5s
      timeout: 2s
      retries: 10

  proxy:
    image: nginx:1.27.5-alpine
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  locust:
    profiles:
      - load
    build:
      context: ..
      dockerfile: Dockerfile.locust
    entrypoint:
      - locust
      - -f
      - locustfile.py
    command: []
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    environment:
      LOCUST_HOST: http://proxy:8000
    volumes:
      - ./resultados:/resultados
    depends_on:
      - proxy
