name: CI Unit Tests + DockerHub Publish

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "Niveles/3/CICD/unit_testing/demo_app/**"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Niveles/3/CICD/unit_testing/demo_app/**"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"

env:
  PYTHON_VERSION: "3.11"
  APP_PATH: "Niveles/3/CICD/unit_testing/demo_app"
  IMAGE_NAME: "<dockerhub-usuario>/mlops-unit-testing-demo"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $APP_PATH/requirements.txt

      - name: Run unit tests
        run: |
          cd $APP_PATH
          pytest -q

  publish-dockerhub:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
